name: Ubuntu Qt image deployment

on:
  push:
    branches: [main, "releases/*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and publish ${{ matrix.arch }} image
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Docker Login
        # You may pin to the exact commit or the version.
        # uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        uses: docker/login-action@v4.8.0
        with:
            # Username used to log against the Docker registry
            username: ${{ secrets.DOCKER_LOGIN }}
            # Password or personal access token used to log against the Docker registry
            password: ${{ secrets.DOCKER_DEPLOYMENT_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          file: Dockerfile
          pull: true
          push: true
          platforms: ${{ matrix.platform }}
          tags: mateuszokroj1/ubuntu-qt-base:build-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  publish:
    name: Publish multi-platform image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Docker Login
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_DEPLOYMENT_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push multi-platform manifest
        run: |
          docker buildx imagetools create \
            --tag mateuszokroj1/ubuntu-qt-base:latest \
            mateuszokroj1/ubuntu-qt-base:build-${{ github.sha }}-amd64 \
            mateuszokroj1/ubuntu-qt-base:build-${{ github.sha }}-arm64
