name: Ubuntu Qt image CI

on:
  pull_request:
    branches: [main, "releases/*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Docker Login
        # You may pin to the exact commit or the version.
        # uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        uses: docker/login-action@v4.8.0
        with:
            # Username used to log against the Docker registry
            username: ${{ secrets.DOCKER_LOGIN }}
            # Password or personal access token used to log against the Docker registry
            password: ${{ secrets.DOCKER_READ_KEY }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v7.4.0
        with:
          file: Dockerfile
          pull: true
          push: false
          platforms: linux/amd64, linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
